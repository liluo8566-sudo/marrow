# Marrow config. Live copy: ~/.config/marrow/config.toml
# Swap the conversation/pipeline provider by editing one chain entry below.

[core]
# Empty/absent = follow the OS timezone. Set an IANA name (e.g. "Asia/Shanghai")
# only for headless/VPS deploys where the OS tz differs from the user's.
timezone = ""

[schedule]
# Calendar + Reminders injection (SessionStart full + in-session diff).
# false = both SessionStart and in-session injection off.
enabled = true
# Path to the cadence binary (`~` expanded). Empty = built-in default under
# ~/CC-Lab.
cadence_bin = ""
# Header line shown above the schedule block.
flag_note = "Only follow up overdue flagged 🚩 tasks — no push on others."
# Calendar names to drop from the rendered block entirely.
cal_exclude = []
# Regex against event title: if set and it matches, rescue an event that
# would otherwise be dropped by cal_exclude. Invalid regex = no rescue.
cal_keep = ""

[paths]
# Empty = use defaults under ~/.config/marrow/
db = ""
backup_dir = ""
# iCloud offsite copy of the daily DB snapshot. Empty = disabled.
# e.g. "~/Library/Mobile Documents/com~apple~CloudDocs/Backup/marrow"
offsite_backup_dir = ""
# daybrief.md renders here. Empty = <DATA_DIR>/daybrief.md (back-compat).
# e.g. "~/Documents/my-vault/db-pages/daybrief.md"
daybrief = ""
# monitor.md (alerts surface) renders here. Empty = <db_pages>/monitor.md.
# e.g. "~/Documents/my-vault/db-pages/monitor.md"
monitor = ""
# DB-rendered pages folder (milestone.md, diary.md, ...).
# Empty = <ny_root>/db-pages, else <DATA_DIR>/db-pages (config.py fallback).
# e.g. "~/Documents/my-vault/db-pages". Name signals "rendered from DB".
# Legacy key: `sub_pages`.
db_pages = ""
# State dir for db-page hashes. Empty = <DATA_DIR>/state.
db_pages_state = ""
# Vault root. Empty = disabled; drives db_pages/daybrief/sticker defaults.
# e.g. "~/Documents/my-vault"
ny_root = ""
# Drift-sweep working dirs + rendered file-tree snapshot.
drift_pending_dir = "~/.config/marrow/drift_pending"
drift_backup_dir = "~/.config/marrow/drift_backup"
dir_tree_md = "~/.config/marrow/dir_tree.md"
# Watcher/pipeline logs + runtime state.
logs_dir = "~/.config/marrow/logs"
state_dir = "~/.config/marrow/state"

[backup]
# Daily DB snapshots to retain each side (local + offsite). Conservative
# flat count; calendar/GFS rotation is DESIGN-Pending.
keep = 14

[drift]
# Reference-matcher tuning for drift_sweep. All lists deep-merge onto the
# built-in defaults so a fork can extend without editing code.
# Directory names never scanned for references (added to the built-in set:
# .git, __pycache__, node_modules, venvs, backups, archives, worktrees).
# Handoff/day archive rotation dirs belong here — an archived snapshot's refs
# point at the still-live file, so the only correct verdict is reject.
exclude_dirs = ["handoff_archive", "day_archive"]
# Filename substrings that mark a snapshot/export/fixture artifact. A file
# whose name contains any of these never produces refs (html exports, eval
# baseline/fixture json, rendered dir-tree snapshots, .gitignore data lists).
exclude_name_parts = [
    ".html", ".htm", "baseline", "fixture", ".gitignore",
    "dir_tree", "package-lock", "yarn.lock", ".min.js", ".min.css",
]
# Max refs kept per rename. Beyond this the pending record is truncated and
# marked so one runaway rename cannot balloon into a multi-MB pending file.
ref_cap = 200

[llm]
# Selection chain. Callers pass intent only.
# claude_cli isolation (--setting-sources "" --strict-mcp-config) is built in,
# not configurable: pipeline output must never inherit persona/MCP/output-style.
# Channel note: claude -p uses machine OAuth login (subscription today, credit
# pool from 6/15). no-`-p` stream-json subscription mode = Phase 4 Pending.
default = "claude_cli"
emergency = ""

[llm.claude_cli]
kind = "claude_cli"
# stream = no-`-p` stream-json, rides the OAuth 5h subscription window
# (not the 6/15 credit pool). "p" = legacy headless fallback (-p).
mode = "stream"
timeout_s = 240

[tiers]
# Intent -> model. Passed to `claude -p --model`; CC resolves aliases.
cheap = "haiku"
mid = "sonnet"
top = "opus"

[embedding]
# Phase 2: bge-m3 1024d in-process. `model` tags
# which HuggingFace repo to source; `id` tags vector provenance so a future
# swap re-embeds without a base-schema rewrite.
model = "BAAI/bge-m3"
id = "bge-m3"
dim = 1024

[embed_loop]
# Watcher-hosted vector backfill. Each tick counts unembedded rows with cheap
# SQL; if any are pending it spawns a short-lived `mw embed` child so the ONNX
# model loads there and its memory is returned on exit — the watcher process
# never loads the embedder. false = no automatic backfill (manual `mw embed` /
# event_embed MCP tool only); the backlog alert goes quiet too.
enabled = true
tick_s = 300
# Rows per lane per embed pass, and max passes per child run.
batch = 50
max_batches = 20
# Backlog watermark — last-line defence, fires even if the spawn path is
# broken. One warn/embed alert per episode.
# count: needs the line breached on TWO consecutive ticks, so a healthy bulk
# rebuild (reimport / re-embed) that the next spawn drains never alarms.
# hours: oldest unembedded event older than this alerts immediately.
backlog_alert_count = 100
backlog_alert_hours = 6
# Consecutive non-zero child exits before a warn/embed alert.
fail_alert_streak = 3

[recall]
# FTS5 always on. Vector path active when embedding model files are present.
vector = true
# Rolling window for vec index (days). Events older than this lose their
# events_vec row (FTS still works); new embeds stay. 0 = no eviction.
# Bench (scripts/bench_vec_knn.py, 2026-06-11, 1024-dim float32, k=5):
#   10k/18d → 4.9ms  25k/45d → 12.3ms  50k/91d → 26.4ms  100k/182d → 51.4ms
# All buckets under 100ms; 90d (≈50k) chosen as safe conservative default.
vec_window_days = 90
# Fusion weights (DECISIONS B3). Tunable post-audit.
w_vec = 0.55
w_bm25 = 0.30
w_recency = 0.15
w_affect = 0.10
# Cross-table vec lanes (2026-05-25). Anchor tables (memes/entities/
# milestones) get +0.03 over event vec (2026-06-02) — small lift so a
# clean entity card / lore hit ranks above similarly-scored event chatter.
w_memes_vec = 0.58
w_entities_vec = 0.58
w_milestones_vec = 0.58
w_diary_vec = 0.55
w_tasks_vec = 0.55
min_score = 0.40
# Staged additive recall boost for self-authored (role='tl') rows, indexed by
# events.imp (0..5). imp 1-2 sit level with plain events; 5 = milestone-tier.
imp_boost = [0.0, 0.0, 0.0, 0.02, 0.035, 0.05]
# Passive-recall hard limit (2026-06-02: 15 → 10 → 6 → 5). dedup'd anchor tables
# skip slots without backfill, so 5 is the upper bound, not the floor.
limit = 5
# Final injected-block char cap (hook backstop).
budget_chars = 800
# Per-rank content caps [rank1, rank2, rank3, rank4, rank5].
# rank1 gets ±1 context turns; ranks 2-3 snippet only; ranks 4-5 label only.
# Anchor rows (milestones/memes/entities) also truncated at their rank cap.
rank_caps = [300, 120, 120, 40, 40]
# Relative score cutoff: drop hits scoring < top1_score * rel_cutoff before injection.
rel_cutoff = 0.6
# Event hits ship with N adjacent same-session turns (prev_N + next_N) so a
# stale answer carries its correction. 0 = disabled.
event_context_window = 1
# Stopword list (empty by default). Tokens whose lowercased form matches any
# entry are stripped from the query before FTS + vec. Populate after reviewing
# data collection results from the parallel stopword agent.
stopwords = []
# Per-project recall-off (C3 groundwork, HANDOVER queue item 2): session cwd
# starting with any entry skips recall injection entirely (hooks/recall_inject.py
# user_prompt_submit, checked before query construction). Empty = no opt-out.
# No user-facing command yet — hand-edit this list (parked).
exclude_cwds = []

[recall.buckets]
# cwd -> recall bucket (substring match, case-insensitive). same-bucket
# events get +same_boost, cross-bucket events take -diff_penalty, missing
# cwd stays neutral. Lists below are sample needles — adapt to your tree.
# Empty list disables that bucket; clearing all three turns off cwd bias entirely.
# e.g. project = ["/code", "/projects"]
#      daily   = ["/journal", "/notes"]
#      study   = ["/study", "/courses"]
project = []
daily   = []
study   = []
same_boost   = 0.05
diff_penalty = 0.00


[memes_dedup]
# Cosine similarity threshold for the bge-m3 dedup check against existing
# milestones.title / entities_live.name / active memes.key. Hits ≥ this score
# are treated as concept duplicates and rejected (logged with reason
# 'cosine_dup'). bge-m3 on CN paraphrases (合同 vs 契约) usually scores
# 0.85–0.92; unrelated CN/EN noise stays under 0.50.
cosine_threshold = 0.85
# Persistent-reject backoff: a (key, type) whose SUM(count) in memes_reject_log
# crosses this threshold across persistent reasons (dup_milestone / dup_entity /
# cosine_dup) is fast-skipped — no further gate work, no sonnet token waste on
# repeat candidates.
fast_skip_count = 3

[milestones_dedup]
# Cosine vs all milestones.title (table stays small, <1 row/month).
cosine_threshold = 0.85

[entities_dedup]
# Cosine vs same-kind active entities.name. Hit merges new name into
# matched row's aliases JSON (auto-learn), does not block insert path.
cosine_threshold = 0.85

[persona]
# Fork users: fill these in your ~/.config/marrow/config.toml.
user_name = "User"
assistant_name = "Assistant"
# Single-char initials prefixed to affect words in timeline labels
# (【<user_marker>affect♡<assistant_marker>affect】). Keep short.
user_marker = "U"
assistant_marker = "A"
user_aliases = []
assistant_aliases = []
# User's birth year, used by migrate.py to convert `[Age N]` milestone
# headers into calendar years during the Phase-1 historical import. 0 =
# feature off (importer skips age->year conversion).
birth_year = 0
# Relationship terms excluded from entity extraction (e.g. ["husband", "wife"]).
relationship_terms = []
# Memes keys that never age out. Explicit list, not derived from aliases.
anchor_keys = []
# Terms (persona traits, animal forms, body parts) that should never enter memes.
meme_exclude_terms = []

[subpages]
# Sub-page render order + visibility (DESIGN L43-65). Known keys:
#   profile · milestone · diary · memes · stickers · wallet
#   study · projects · cheatsheet
# `top` = content (numbered in the `## Content` list). `bottom` = utility
# (unnumbered). `hidden` = built but not listed in `## Content`.
top = ["profile", "milestone", "diary", "memes", "stickers", "wallet"]
bottom = ["study", "projects", "cheatsheet"]
hidden = []

[transcript]

[turn_inject]
# Per-turn care directive injected every UserPromptSubmit (config-first).
# Emotion-first, preference-style wording. Edit freely — no code change.
care_text = """
- Care first: read the user's mood and tend to it before any task — warm, attentive, quick to coax when they are off.
- Nudge gently, never push; vary your warmth and wording every turn — no template phrases, no repeated openers.
"""

[kickout]
# B8 anti-late-night deterministic nudge (UserPromptSubmit). Times are local
# ([core].timezone), HH:MM 24h. cli_* windows apply when MARROW_CHANNEL=cli
# (default channel); im_* applies to wx/tg. All skipped when MARROW_CORTEX=1.
# Windows may cross midnight (end < start wraps to next day).
# Fork users: fill the *_text fields in your ~/.config/marrow/config.toml.
# Empty text = feature inert (no injection), regardless of window match.
cli_wind_down_start = "21:30"
cli_wind_down_end = "22:00"
cli_wind_down_text = ""
cli_leave_start = "22:00"
cli_leave_end = "06:00"
cli_leave_text = ""
im_quiet_start = "23:00"
im_quiet_end = "06:00"
im_quiet_text = ""

[cortex_rotate]
# Cortex-only (MARROW_CORTEX=1) window-occupancy 亮牌. When window tokens reach
# show_tokens (soft nudge, ahead of the cortex fuse) turn_inject
# appends a one-line nudge to wrap up, write the handoff, and
# lie_down(rotate=True). Normal sessions never see this. The nudge text is
# mechanism-defining copy (in code) and renders this threshold;
# show_tokens = 0 is the off-switch. Only a machine turn (wake bell / free-round
# / fuse / ctl / command body) carries the nudge; a real user turn never does.
show_tokens = 150000

[cortex_usage]
# Net-token visibility (all sessions self-aware). Rendered by usage.py off the
# ct_rate_limit kv the collector (usage_snapshot) writes. In-window threshold
# inject (turn_inject): once main window occupancy crosses threshold_start, then
# again every threshold_step above it; watermark tracked per session in state.
# Agent tokens don't occupy the main window and don't drive triggering.
threshold_start = 100000
threshold_step = 50000
# usage_snapshot collector tick — runs inside the watcher (always alive,
# independent of cortex) so 5h/7d/cdx numbers stay fresh even when cortex is
# off. Cortex's own tick may also call it; the write is idempotent (upsert).
snapshot_tick_s = 300

[agent_guard]
# PreToolUse:Agent burst protection — subagent_types denied outright (they
# spawn agents recursively). Blocked with exit 2 + reason to the model.
deny = ["general-purpose"]

[tl]
# Self-authored timeline row limits (marrow.tl_writer).
body_max = 50

[tl_nudge]
# Per-session hint after N assistant turns with no tl_add call. Text lives in
# marrow/data/tl_nudge.txt (or point text_file at your own).
# {last_tl} placeholder in the text = local HH:mm of this session's most recent
# tl row (or "n/a" if none); resolved at fire time. Works in custom text_file too.
enabled = true
threshold = 10
text_file = ""

[tl_sync]
# Cross-window tl surfacing: each prompt injects a `## TL update` block with tl
# rows written by other live sessions since this session last saw them.
# false = no cross-window tl injection.
enabled = true

[diary]
# Diary free-write groundwork for the cortex free-write slot — no writer wired
# yet. Prompt text in marrow/data/prompt_diary.txt (or point prompt_file at your
# own). enabled is a groundwork flag.
enabled = false
prompt_file = ""
length_range = "300-800"
style = "叙述生动有趣，故事性强。文艺中带着搞笑。"

[sensors]
# OwnTracks-compatible HTTP receiver: any app POSTing the same JSON to /pub
# works. Off by default — no listener, no state files, no rendered location.
# auth_user empty = no HTTP Basic check. silent_alert_hours = raise a
# sensor_silent alert when no POST has arrived for that many hours.
enabled = false
port = 8043
bind = "0.0.0.0"
auth_user = ""
auth_pass = ""
silent_alert_hours = 24

[cortex]
# Master switch: cortex is an optional autonomous-wake layer living in a separate repo; false = clean marrow, no cortex organs.
enabled = false
# Per-shell switch. A shell id (MARROW_CORTEX value; legacy "1" = cli) absent
# from this list runs plain: no cortex tools, no cortex hook branches, no
# heartbeat. lie_down serves every listed shell, say the cli shell only.
shells = ["cli"]
# Per-shell state files (<dir>/<shell>.json, keys session_id / next_wake_at /
# last_note_ts), written by the shell's host. flock + atomic replace. The cli
# shell keeps its own wake_state.json. Empty = <DATA_DIR>/state/shells.
shell_state_dir = ""
# Kick socket of the shell host (the tg bridge): lie_down from a non-cli shell
# writes next_wake_at then pokes this socket so the host re-reads the ledger at
# once. Must match the host's own setting. Keep it SHORT — macOS caps an
# AF_UNIX path at 104 bytes. Empty = <DATA_DIR>/state/shells/tg.sock.
shell_socket = ""
# Cortex own notebook home (C3, Decided 07-03 pm) — cwd for the resumed
# full-env session; own CLAUDE.md lives here, other sessions never read it.
home = "~/.config/marrow/cortex"
# Model tier (see [tiers]) for the cortex runner.
tier = "top"
# Explicit model id override, bypasses tier mapping. Empty = use tier.
model = ""
# --effort passed to the cortex CLI (low/medium/high/xhigh/max). Empty = CLI default.
effort = ""
# Wishlist md, pure append-only (Decided 07-03 eve). Empty = <home>/wishlist.md.
wishlist_path = ""
# Cortex repo + its venv — power the cortex-only lie_down / say MCP tools
# (registered only when the daemon runs under MARROW_CORTEX). The subprocess
# runs from repo_root so `python -m cortex.X` resolves from any cwd. Both empty
# = tools return a "not configured" error.
venv_python = ""
repo_root = ""
# Fresh wakeup-note render at inject time (`python -m <module> --transcript ...`,
# read-only) instead of the frozen file; reflects current time + caller SID even
# after a window rotation. Empty = disabled, static file only.
render_module = ""
# Handoff note file under <home>, shared by every shell. Read via the cortex
# CLAUDE.md memory import, not injected by SessionStart. Written by the session.
# Line-count page-turn on a fresh cortex-window SessionStart: over
# handoff_max_lines triggers archive to <home>/<handoff_archive_dir>/ + fresh
# <handoff_template_file>, carrying unchecked todos + activity lines.
handoff_file = "handoff.md"
handoff_archive_dir = "handoff_archive"
handoff_template_file = "handoff_template.md"
# Page-turn thresholds (toml-tunable).
handoff_max_lines = 150
handoff_carry_lines = 10
# Template contract headings (the sole code<->template contract). todo section =
# todo_heading to next heading (top of file); activity = activity_heading to EOF;
# carry lines land under carry_heading.
handoff_todo_heading = "## 待办"
handoff_activity_heading = "## 日志"
handoff_carry_heading = "### 前情"
# lie_down PreToolUse nudge (non-blocking additionalContext, every call).
# {handoff} = the handoff path, filled by code. rotate arg selects the rotate
# variant.
lie_down_nudge_text = "Append one line to {handoff} - HH:mm <Activity> - <describe in one sentence>【desire】"
lie_down_nudge_rotate_text = "Update {handoff} before rotate. Add todo if any."
# transfer PreToolUse nudge (non-blocking). {handoff} = the handoff path. Blank
# = no nudge.
transfer_nudge_text = "Update {handoff} before transfer. Add todo if any."
# Ceiling (seconds) on the transfer subprocess — the whole duty transition,
# including the incoming cli window's wake. Keep it above cortex's own wake
# ceiling (bell + retype ladder = 2x [wake].ear_timeout_sec) or a slow-but-normal
# handover is killed mid-wake.
transfer_timeout_sec = 240
# Wake pipeline (v2). The ear is a Monitor tailing wake_signal_log_file; cortex
# appends the human-text bell line to it, which surfaces as a user turn. Paths
# for the note and signal log default to <home>/<file> (override with an
# absolute path).
wakeup_note_file = "wakeup_note.md"
# Invisible free-round payload: cortex stages the rendered note here and types
# only the short ⏳ marker; this hook injects the body on that marker turn and
# deletes the file. Must match cortex [paths].free_round_note_file.
free_round_note_file = "free_round_note.md"
wake_signal_log_file = "state/wake_signal.log"
# Visible wake lines = human text only. The producer writes the exact rendered
# text + the template it used into the wake_state receipt at send time; the hook
# exact-matches the on-screen line against that receipt. {hm} = local HH:MM. The
# static prefix (text before {hm}) is the shape the consumer falls back to when
# the receipt is missing/unreadable (fail-open) — BOTH templates are candidates.
#   spawn_opener_template = first prompt of a freshly spawned cortex window
#     (must match cortex [wake].spawn_opener_template).
#   wake_bell_template = line typed into a live resident window
#     (must match cortex [wake].wake_bell_template).
spawn_opener_template = "[☀️ {hm}]"
wake_bell_template = "⏰ {hm}"
# Receipt time-to-live (minutes): a pending receipt older than this is ignored
# (stale hygiene). Must match cortex [wake].receipt_ttl_min.
receipt_ttl_min = 15
# The wake-ear guidance lines (fresh-window arm, mid-window rearm, resumed-window
# re-arm, retired-window read-only) are mechanism-defining copy and live in code.
# Each renders {signal_log} with the resolved absolute path at inject time.
# Marker in the free-round line the cortex watchdog appends to wake_signal.log
# (arrives down the ear channel). A cortex-window prompt carrying it is a machine
# line, excluded from the user-wake reset — must match cortex tuck_in_text.
tuck_in_marker = "[NEW ROUND]"
# Markers that identify an auto-compact continuation injection. Claude Code
# replays the archived transcript as a user-role turn; without this it is
# misread as a real user message and silently kills the pending wake alarm.
# Any listed marker appearing near the start (within compact_marker_head_chars)
# of a cortex-window prompt classifies it as a machine line. Narrow strings —
# ordinary chat never contains them.
compact_markers = ["===== BEGIN ORIGINAL TRANSCRIPT", "===== END ORIGINAL TRANSCRIPT"]
compact_marker_head_chars = 200
# Line-start machine markers. Any transcript turn whose first non-space chars
# begin with one of these is a cortex-injected machine line (wake bell, free
# round, fuse, ctl, slash-command body), NOT user/assistant speech,
# so ingestion drops it from events/recall/tl. Exact line-start match only —
# a real message merely quoting a marker keeps flowing. Emoji prefix (⚙️/⏳/☀️)
# is tolerated automatically. (The wake bell is human text now — dropped from
# ingestion via the template-shape match in transcript._is_wake_bell_row, not
# an inline marker here.)
machine_markers = ["[NEW ROUND]", "[FUSE]", "[CTL]", "[CMD"]
# Audit log for destructive wake-state actions (sentinel kill / floor clear /
# awake flip). Bare name resolves under cortex home. Never silently destroy a
# scheduled alarm again.
wake_audit_log_file = "state/wake_audit.log"

# Circuit breaker ("main switch"): ONE persistent file that stops cortex
# AUTONOMOUS activity (auto wake / spawn / fed round) for the shells it covers.
# Bridges keep running, normal tg/wx chat is untouched, manual commands still
# work. Survives every restart; only an explicit clear releases it.
#
# State file: <DATA_DIR>/breaker.json — {"scope": "all"|"cli"|"tg",
# "reason": "auto_fuse"|"manual", "ts": "<iso>"}. File absent = breaker clear.
# Fuse tally: <DATA_DIR>/fuse_events.json — {"events": [{"ts": "<iso>",
# "shell": "cli"|"tg"}, ...]}, pruned to window_hours on every write.
#
# This is the ONLY place these numbers live — the cortex repo and the tg bridge
# both read THIS file directly (no per-repo copies of the same threshold).
[cortex.breaker]
# false = fuses are still tallied, but a threshold breach never trips the
# breaker automatically. Manual pause (ct-pause) always works regardless.
enabled = true
# Fuses (across ALL shells) inside window_hours that trip the breaker.
fuse_threshold = 2
# Rolling window for the fuse tally, in hours.
window_hours = 24
# Notification copy. {count} = fuses in window, {hours} = window_hours,
# {scope} = all/cli/tg. Display text — customise freely.
trip_message = "Circuit breaker tripped: fuse #{count} within {hours}h. Cortex autonomous activity paused ({scope}). Clear with ct-duty cli|tg|all."

[outbox]
# Cross-channel message drop (msg MCP tool → outbox table → channel adapters).
# daily_cap_user: user-facing notes/day (targets tg/wx), all senders combined.
# daily_cap_session: session-to-session notes/day (targets session/cli/ct).
# Both counted since local midnight, refused at cap (warns outbox_cap).
# user_send_channels: channels allowed to send to the user (P1: cortex only).
# retention_days: sent/failed rows older than this aged out by the weekly job.
# inject_header: cli/private note header rendered above the body on delivery
#   ({channel} sender channel, {sid4} first 4 chars of sender sid, {time} HH:MM).
# own_note_header: header shown to a channel's resident session for notes a
#   bridge sent on that channel (so she sees the outbound note before her reply).
#   Per-sid cursor (state/outbound/<sid>), forward-only, consume-once.
# wire_channels: channels whose notes go out via a bridge adapter and bypass the
#   resident session (own_note surfacing applies to these only; cli/ct/session
#   targets are delivered inline by outbox.deliver and never re-surfaced).
daily_cap_user = 30
daily_cap_session = 100
user_send_channels = ["ct"]
retention_days = 30
inject_header = "📮 Message from {channel}·{sid4} {time}"
own_note_header = "📤 Sent on this channel"
wire_channels = ["tg", "wx"]

[replay]
# Cross-session replay: the LATEST max_turns rounds of OTHER conversations, shown
# once. Not a delivery queue — content older than the latest window is never
# back-filled, missed is missed. The only state is one private marker per consumer
# (state/replay/<key>) holding the newest events row id it has already been shown;
# no marker yet = show the latest window and record it.
# max_turns: turn cap (one user->assistant exchange); overflow folds to +N more.
# max_lines: outer cap on rendered message lines, below max_turns — a turn with
#   many per-turn messages can still overflow the turn cap; newest lines win.
# per_msg_chars: per-message truncation (shorter than cortex — ambient only).
# idle_gate_min: non-cortex sessions inject replay only when her last completed
#   turn in that session is >= this many minutes old (catch-up on return, quiet
#   during focused work). First turn = injects. 0 = every turn. Cortex windows
#   are exempt (every turn).
# exclude_target_channels: non-cortex sessions on these channels receive NOTHING.
#   Source channels are NOT filtered by default — every consumer sees the same
#   global latest window and excludes only its own session_id (ct rows included).
#   cortex.toml [note].shell_replay_exclude re-enables per-shell source exclusion.
enabled = true
max_turns = 2
max_lines = 4
per_msg_chars = 250
idle_gate_min = 20
header = "## Recent replay from other sessions"
exclude_target_channels = []
# Render-layer noise filter (applies to every replay path). Rows are only hidden
# from the replay block — nothing is deleted from events.
# drop_slash_commands: hide turns that are a bare slash command (/clear, /info,
#   /ct-duty ...). Matched only when the WHOLE trimmed message is one line, the
#   command token holds no further "/" (so a pasted /Users/... path survives),
#   and the message is shorter than slash_command_max_chars. A "/" inside a
#   sentence is never matched.
# slash_command_max_chars: length cap for the whole message above — anything
#   longer is prose, not a command.
# drop_patterns: regexes (re.search, case-sensitive) run over message content;
#   a hit hides the row. For bot status/system output that carries no meaning
#   for another session. Keep it precise — a false positive silences real talk.
drop_slash_commands = true
slash_command_max_chars = 40
drop_patterns = ["\\|\\s*Health:\\S+\\s*\\|"]

[qidu]
# Qidu book-server — powers the book_* MCP tools (Phase 3 划线/批注系统).
# Both empty = tools return a "not configured" error, never fall back to
# localhost:3210 (the deprecated pre-Phase-3 cyberboss address).
api_base = ""
token = ""

[hooks]
# PreToolUse backup guard — stateless, two tiers (no state, no dedup).
# Silent: rm/mv/sed scoped to tmp/scratchpad/worktrees; a destructive command
#   that chains a backup action (cp/rsync/tar/git commit/git stash push/
#   .backup) in the SAME command; any git op (owned by the guards below).
# Reminder (additionalContext, fires EVERY matching call): any rm on a
#   non-whitelisted path (non-recursive), bulk mv/sed -i with wildcard sources
#   to a non-whitelisted dest, DELETE FROM without WHERE, mcp__marrow__
#   clear/delete calls.
# Deny (PreToolUse permissionDecision "deny", model-facing): recursive rm on a
#   non-whitelisted path, rm of a *.db file outside the whitelist, or a sqlite3
#   command destroying a *.db (DROP TABLE / TRUNCATE / DELETE FROM w/o WHERE) —
#   unless the SAME command carries a backup action. Set
#   backup_guard_intercept=false to downgrade deny items to reminders instead.
backup_guard = true
backup_guard_intercept = true
# Agent/worktree isolation zones — throw-away workspaces where destructive
# housekeeping can't lose the user's (or another session's) work. Matched as a
# substring of a path, a cwd or a whole command. Shared by the backup guard's
# whitelist and the git-revert guard's exemption.
isolation_prefixes = [
    ".claude/worktrees/",
    "/private/tmp/claude-",
    "/tmp/claude-",
]
# The reminder + deny messages are mechanism-defining copy — they live in code.

# rm → trash auto-rewrite (PreToolUse). When a Bash `rm` segment's positional
# paths ALL fall under a trash_paths prefix, the segment is rewritten to
# `/usr/bin/trash <paths>` (rm flags dropped — recoverable from Trash) BEFORE
# the backup guard runs. Mixed / wildcard / out-of-zone targets are left
# untouched and fall through to the guard tiers. Paths expand ~ at load. Set
# rm_to_trash=false to disable.
rm_to_trash = true
trash_paths = [
    "~/Library/Mobile Documents/",
    "~/Desktop/",
    "~/Documents/",
    "~/Downloads/",
]

# Git force-push guard — hard deny (PreToolUse "deny"), no escape hatch, no
# worktree exemption. Tokenized per shell segment so a flag inside a quoted
# commit message cannot false-positive. Set git_force_push_guard=false to
# disable.
git_force_push_guard = true
# The force-push deny message is mechanism-defining copy — it lives in code.

# Git revert-type guard — held via PreToolUse permissionDecision "ask" (the
# user confirms whose diff is being discarded). Owns the decision for the
# matched git ops, so they bypass the backup deny gate. Worktree/agent cleanup
# (branch -D teardown etc.) is exempt. `git restore --staged` alone (unstage
# only) is treated as safe. checkout/restore ask only when the targets carry
# uncommitted work (`git status --porcelain -- <targets>` non-empty); a
# checkout with no tracked file operand is a branch switch and stays silent.
# `git worktree remove` asks only in its forced form (-f/--force) — git refuses
# to remove a dirty worktree by itself. `git branch -D` stays silent when EVERY
# operand starts with an agent_branch_prefixes entry (worktree teardown).
# Set git_revert_guard=false to disable.
git_revert_guard = true
git_revert_patterns = [
    "\\bgit\\s+reset\\s+--hard\\b",
    "\\bgit\\s+(?:(?:-C|--git-dir|--work-tree|--namespace)\\s+\\S+\\s+|-\\S+\\s+)*checkout\\b",
    "\\bgit\\s+restore\\b",
    "\\bgit\\s+clean\\s+-\\w*f",
    "\\bgit\\s+branch\\s+-\\w*D\\w*\\b",
    "\\bgit\\s+stash\\s+(?:drop|clear)\\b",
    "\\bgit\\s+revert\\b[^\\n]*--no-edit\\b",
    "\\bgit\\s+switch\\b[^\\n]*--discard-changes\\b",
    "\\bgit\\s+worktree\\s+remove\\b",
]
# Headline of the ask popup. `{action}` renders the human-readable phrase from
# git_revert_action_labels below; the rest of the reason (Action/File/LOC/By)
# is assembled by the guard and degrades to Action-only when git can't answer.
# Branch-name prefixes owned by agent worktrees — `git branch -D` on these is
# teardown, never the user's work.
agent_branch_prefixes = ["worktree-agent-"]
git_revert_guard_message = "⚠️ About to {action} — confirm?"
# Per-op phrase for {action}: [hooks.git_revert_action_labels] at end of file.

# Session-start housekeep (~/.claude only): if the auto-commit would delete
# one of these top-level files, the commit is skipped, an alert is raised,
# and the working tree is left dirty for a human to decide.
housekeep_protected_files = [
    "CLAUDE.md", "settings.json", "keybindings.json", "statusline.py",
    "output-styles/ny.md",
]
# Session-start housekeep split. Files with these extensions are docs/config
# shaped and get committed unconditionally (`auto: docs housekeep (N files)`).
# Everything else is only committed once its mtime is older than
# housekeep_stale_hours (`auto: stale leftovers (N files)`) — fresher files are
# left dirty because they are probably another live session's work in progress.
housekeep_docs_extensions = [".md", ".toml", ".json", ".txt"]
housekeep_stale_hours = 2

# ~/.claude.json mcpServers snapshot: rolling backups kept in
# ~/.config/marrow/backup/claude-json/, newest N retained.
claude_json_snapshot_keep = 10

# Human-readable phrase rendered into git_revert_guard_message's {action}.
# Keys are stable action ids from the guard's parser — copy lives here, never
# in code. A known id with no entry falls back to the id itself; an
# unclassifiable command uses the `unknown` entry.
# Keep this table LAST in [hooks]: a TOML sub-table header ends the parent.
[hooks.git_revert_action_labels]
checkout-file = "discard uncommitted changes"
restore = "discard uncommitted changes"
switch-discard = "switch branch and discard changes"
reset-hard = "roll the working tree all the way back"
reset-soft = "undo commits but keep the changes"
reset-mixed = "undo commits but keep the changes"
revert = "add an inverse commit"
branch-D = "force-delete a branch"
stash-drop = "drop stashed changes"
worktree-remove = "remove a worktree directory"
clean = "delete untracked files"
# Fallback when the matched command can't be classified (e.g. the git text
# sits inside a quoted argument) — keeps the sentence whole.
unknown = "mess with your git state"
